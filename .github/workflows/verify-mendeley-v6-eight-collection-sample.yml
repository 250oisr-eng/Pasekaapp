name: Verify real Mendeley v6 16 originals from 8 hive collections
on:
  pull_request:
    paths:
      - 'tests/fixtures/mendeley-v6-user-16-pairs.csv'
      - 'tools/stage_mendeley_v6_public_csv.py'
      - 'tools/prepare_mendeley_v6_yolo_unassigned.py'
      - '.github/workflows/verify-mendeley-v6-eight-collection-sample.yml'
permissions:
  contents: read
jobs:
  real-v6-eight-groups:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact user-uploaded CSV SHA256 (metadata only)
        run: |
          echo 'c90630a59a2eef13cdd4210ba1a4d7b48ff9642e487b2bbac27ce4554c95e8d0  tests/fixtures/mendeley-v6-user-16-pairs.csv' | sha256sum -c -
      - name: Install free Pillow JPEG decoder in isolated CI
        run: python -m pip install --disable-pip-version-check --no-deps Pillow==12.0.0
      - name: Secure CSV regression tests, no network during tests
        run: python -m unittest discover -s tests -p 'test_stage_mendeley_v6_public_csv.py' -v
      - name: Verify original 16 public image-label pairs, all 8 groups, no train/test or binaries retained
        run: |
          python tools/stage_mendeley_v6_public_csv.py \
            tests/fixtures/mendeley-v6-user-16-pairs-pinned.csv \
            --output-coco "${RUNNER_TEMP}/user-16-unassigned-coco.json" | tee "${RUNNER_TEMP}/user-16-manifest-report.json"
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "user-16-manifest-report.json").read_text())
          coco = json.loads((root / "user-16-unassigned-coco.json").read_text())
          groups = collections.Counter(record["hiveCollectionFolder"] for record in report["files"])
          expected = {"_bee_20230609a", "_bee_20230609b", "_bee_20230609c",
                      "_bee_20230609d", "_bee_20230609e", "_bee_20230711a",
                      "_bee_20230711b", "_bee_20230711c"}
          assert set(groups) == expected and all(n == 2 for n in groups.values()), groups
          assert report["images"] == len(coco["images"]) == 16, report
          assert report["annotations"] == len(coco["annotations"]) == 113, report
          assert report["allOriginalJpegsFullyDecoded"] is True
          for flag in ("sourceVideoSessionIdsVerified", "independentHoldoutVerified",
                       "completeDatasetVerified", "trainingAuthorized",
                       "recognitionSucceeded", "cleanupAuthorized"):
              assert report[flag] is False, (flag, report[flag])
          assert coco["info"]["split"] == "unassigned"
          assert coco["info"]["trainingAuthorized"] is False
          assert coco["info"]["sourceCreator"] == "Tomyslav Sledevic"
          assert coco["info"]["sourceLicense"] == "CC BY 4.0"
          first = next(f for f in report["files"] if f["imageFile"] == "20230609a1002.jpg")
          assert first["imageSha256"] == "dcccf2db87e3f964870cfd84a65ad0ba9e81e992194b8f2fa18c16107fea41f3"
          assert first["labelSha256"] == "ab25e4c0d29898983b78cc8241271ca4a66095332c32c8f0d29aab68d32f68d5"
          unique = {f["imageSha256"] for f in report["files"]}
          assert len(unique) == 16
          image_to_group = {im["id"]: im["hiveCollectionFolder"] for im in coco["images"]}
          box_counts = collections.Counter(image_to_group[a["image_id"]] for a in coco["annotations"])
          print("REAL_16_V6_PAIRS_VERIFIED",
                json.dumps({"groups": dict(sorted(groups.items())),
                            "images": len(coco["images"]),
                            "annotations": len(coco["annotations"]),
                            "beeBoxesByGroup": dict(sorted(box_counts.items())),
                            "allFullDecoded": True,
                            "trainingAuthorized": False,
                            "cleanupAuthorized": False}))
          PY
      - name: Delete temporary derived files (always, including failure)
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/user-16-manifest-report.json" \
                   "${RUNNER_TEMP}/user-16-unassigned-coco.json"
