name: P0 Android emulator offline safety smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'scripts/android-emulator-smoke.sh'
      - 'scripts/prepare-p0-emulator-build.mjs'
      - 'tests/android-emulator-smoke-contract.test.mjs'
      - 'index.html'
      - 'js/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-web.mjs'
      - 'scripts/patch-android-gradle.mjs'
      - 'scripts/prepare-android-archive-download.mjs'

concurrency:
  group: p0-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout synthetic test branch
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Check emulator test contract
        run: node --test tests/android-emulator-smoke-contract.test.mjs
      - name: Enable virtualization for a disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and test an isolated Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-p0-emulator-ci.sh
