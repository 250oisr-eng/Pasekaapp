name: Audit original v6 detection labels against fan-video frame candidates
on:
  push:
    paths:
      - 'tools/audit_mendeley_v6_cross_annotation_frame_alignment.py'
      - 'tests/test_audit_mendeley_v6_cross_annotation_frame_alignment.py'
      - '.github/workflows/test-v6-cross-annotation-frame-alignment.yml'
  pull_request:
    paths:
      - 'tools/audit_mendeley_v6_cross_annotation_frame_alignment.py'
      - 'tests/test_audit_mendeley_v6_cross_annotation_frame_alignment.py'
      - '.github/workflows/test-v6-cross-annotation-frame-alignment.yml'
permissions:
  contents: read
jobs:
  source-cross-annotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free pinned Python packages
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3 Pillow==12.0.0
      - name: Purely synthetic negative tests and pinned catalogue checks
        run: python -m unittest discover -s tests -p 'test_audit_mendeley_v6_cross_annotation_frame_alignment.py' -v
      - name: Install open-source frame decoder only on ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify original public MP4 JPEG YOLO TXT SHA before cross-label analysis
        run: python tools/audit_mendeley_v6_cross_annotation_frame_alignment.py
