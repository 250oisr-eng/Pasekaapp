name: Audit publisher fan polygon transitions without in-out claims
on:
  push:
    paths:
      - 'tools/audit_public_fan_polygon_transitions.py'
      - 'tests/test_audit_public_fan_polygon_transitions.py'
      - '.github/workflows/test-public-fan-zone-transitions.yml'
  pull_request:
    paths:
      - 'tools/audit_public_fan_polygon_transitions.py'
      - 'tests/test_audit_public_fan_polygon_transitions.py'
      - '.github/workflows/test-public-fan-zone-transitions.yml'
permissions:
  contents: read
jobs:
  source-polygon-transitions:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Pillow dependency only
        run: |
          python -m pip install --only-binary=:all: Pillow==12.0.0
      - name: Offline negative regression tests for false entrance counts
        run: python -m unittest discover -s tests -p 'test_audit_public_fan_polygon_transitions.py' -v
      - name: Read two original publisher-pinned TXT files and enforce measured regression
        run: |
          set -o pipefail
          python tools/audit_public_fan_polygon_transitions.py | tee /tmp/paseka-fan-zone-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/paseka-fan-zone-report.json").read_text())
          expected = {
              "framesEvaluated": 6000,
              "uniquePublisherTrackIds": 1674,
              "referenceObservations": 127452,
              "centersOutsidePublisherPolygon": 493,
              "adjacentSameIdComparisons": 124945,
              "polygonEntryCandidates": 100,
              "polygonExitCandidates": 137,
              "polygonBoundaryTransitionCandidates": 237,
              "tracksWithPolygonTransitions": 128,
              "gapReappearancesNotInterpretableAsCrossing": 833,
              "rapidOppositePolygonBoundaryReversals": 43,
          }
          for key, value in expected.items():
              assert report[key] == value, (key, report[key], value)
          for key in ("publisherPolygonIsCalibratedEntranceLine",
                      "physicalInsideOutsideOrientationVerified",
                      "independentBeeInOutEventLabelsVerified",
                      "actualBeeTrafficCountValidated",
                      "neuralDetectorEvaluated",
                      "androidOfflineInferenceVerified",
                      "beeRecognitionSucceeded",
                      "videoCleanupAuthorized"):
              assert report[key] is False, (key, report[key])
          print("Pinned source geometry-only regression passed; no bee traffic approval")
          PY
