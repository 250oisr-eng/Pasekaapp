name: Test fan IoU association baseline
on:
  push:
    paths:
      - 'tools/baseline_mendeley_v6_fan_association.py'
      - 'tools/run_public_mendeley_v6_fan_baseline.py'
      - 'tools/perturb_mendeley_v6_fan_boxes.py'
      - 'tests/test_baseline_mendeley_v6_fan_association.py'
      - 'tests/test_run_public_mendeley_v6_fan_baseline.py'
      - 'tests/test_perturb_mendeley_v6_fan_boxes.py'
      - '.github/workflows/test-fan-association-baseline.yml'
  pull_request:
    paths:
      - 'tools/baseline_mendeley_v6_fan_association.py'
      - 'tests/test_baseline_mendeley_v6_fan_association.py'
      - '.github/workflows/test-fan-association-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.15.3 Pillow==12.0.0
      - run: python -m unittest discover -s tests -p 'test_baseline_mendeley_v6_fan_association.py' -v
      - run: python -m unittest discover -s tests -p 'test_run_public_mendeley_v6_fan_baseline.py' -v
      - run: python -m unittest discover -s tests -p 'test_perturb_mendeley_v6_fan_boxes.py' -v
      - name: Evaluate genuine SHA-verified public fan tracks (transient TXT only)
        run: python tools/run_public_mendeley_v6_fan_baseline.py
      - name: Stress actual published boxes with synthetic 5pct dropout and 2px jitter
        run: python tools/run_public_mendeley_v6_fan_baseline.py --drop-every 20 --jitter-pixels 2
