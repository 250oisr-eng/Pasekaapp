name: Android Restore335 private-type V5 readonly proof
on:
  push:
    paths:
      - 'tools/android-restore335-private-type-stage-v5.ps1'
      - 'tests/android-restore335-private-type-v5.test.mjs'
      - '.github/workflows/android-restore335-readonly-v5.yml'
  pull_request:
    paths:
      - 'tools/android-restore335-private-type-stage-v5.ps1'
      - 'tests/android-restore335-private-type-v5.test.mjs'
      - '.github/workflows/android-restore335-readonly-v5.yml'
jobs:
  readonly-v5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse PowerShell syntax
        shell: pwsh
        run: |
          $tok=$null; $err=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tools/android-restore335-private-type-stage-v5.ps1',[ref]$tok,[ref]$err)
          if ($err.Count -gt 0) { $err | Out-String | Write-Error; exit 1 }
      - name: Static negative safety tests only (no physical device)
        shell: pwsh
        run: node --test tests/android-restore335-private-type-v5.test.mjs
