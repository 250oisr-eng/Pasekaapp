name: Verify actual Mendeley v6 JPG and YOLO TXT (public, bounded)
on:
  pull_request:
    paths:
      - 'tools/verify_mendeley_v6_public_pair.py'
      - 'tools/prepare_mendeley_v6_yolo_unassigned.py'
      - 'tests/test_verify_mendeley_v6_public_pair.py'
      - '.github/workflows/verify-mendeley-v6-real-pair.yml'
permissions:
  contents: read
jobs:
  actual-public-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run eleven offline negative/security regressions
        run: python3 -m unittest discover -s tests -p 'test_verify_mendeley_v6_public_pair.py' -v
      - name: Read actual 918 KiB JPG and 266-byte YOLO TXT with hard limits
        run: python3 tools/verify_mendeley_v6_public_pair.py
