name: Restore335 readonly stdin SHA diagnostic
on:
  push:
    branches:
      - 'test/android-restore335-stdin-sha-readonly-2026-11-21'
  pull_request:
    paths:
      - 'tools/android-restore335-stdin-sha-readonly.ps1'
      - 'tests/mock_android_restore335_stdin_sha_readonly.py'
      - '.github/workflows/test-android-restore335-stdin-sha-readonly.yml'
permissions:
  contents: read
jobs:
  readonly-probe-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without execution
        shell: pwsh
        run: |
          $t=$null;$e=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tools/android-restore335-stdin-sha-readonly.ps1',[ref]$t,[ref]$e)
          if($e.Count){$e | ForEach-Object {Write-Error $_};exit 1}
      - name: Assert read-only commands and fixed package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/android-restore335-stdin-sha-readonly.ps1').read_text()
          assert "ADB @('-d','shell','-T','run-as',$pkg,'sha256sum') $archive.Bytes" in s
          assert "ADB @('-d','exec-out','cat',$source)" in s
          assert "$archive.Bytes.Length -ne 3158" in s
          assert "NO_INSTALL_NO_WRITE_NO_LAUNCH_NO_RESET_NO_DELETE" in s
          assert all(token not in s.lower() for token in ("adb @('-d','install'", "adb @('-d','push'", "adb @('-d','shell','rm'", "adb @('-d','shell','pm','clear'", "'sh','-c'"))
          PY
      - name: Test actual pwsh with mock ADB and negative cases
        run: python3 tests/mock_android_restore335_stdin_sha_readonly.py
