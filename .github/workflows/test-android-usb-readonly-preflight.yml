name: Validate Android USB read-only preflight

on:
  push:
    paths:
      - 'tools/android-usb-device-readonly-preflight.ps1'
      - 'tools/android-restore335-private-readonly-stage.ps1'
      - 'tools/android-restore335-private-readonly-stage-v2.ps1'
      - 'tests/android-usb-preflight-mock.ps1'
      - '.github/workflows/test-android-usb-readonly-preflight.yml'
  pull_request:
    paths:
      - 'tools/android-usb-device-readonly-preflight.ps1'
      - 'tools/android-restore335-private-readonly-stage.ps1'
      - 'tools/android-restore335-private-readonly-stage-v2.ps1'
      - '.github/workflows/test-android-usb-readonly-preflight.yml'

permissions:
  contents: read

jobs:
  powershell-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse and allowed ADB command audit
        shell: pwsh
        run: |
          $file = 'tools/android-usb-device-readonly-preflight.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw 'POWERSHELL_PARSE_FAILED' }
          $src = Get-Content -Raw $file
          foreach ($term in @('adbSha256','ONE_AUTHORIZED_DEVICE_REQUIRED','NOT_AUTHORIZED','PINNED_ADB_MISSING')) {
            if (-not $src.Contains($term)) { throw "MISSING_SAFETY_GUARD_$term" }
          }
          foreach ($forbidden in @('install','uninstall','push','pull','am start','force-stop','rm -','deleteFile','format','clearPackage')) {
            $calls = [regex]::Matches($src, "(?m)^\s*(?:Call-Adb|\$[A-Za-z][A-Za-z0-9]*\s*=\s*Call-Adb)\s+@\(([^\r\n]*)")
            foreach ($call in $calls) {
              if ($call.Value -match "(?i)\b$([regex]::Escape($forbidden))\b") { throw "DISALLOWED_ADB_COMMAND_$forbidden" }
            }
          }
          Write-Host "POWERSHELL_PARSE_AND_ADB_COMMAND_AUDIT_PASS"
      - name: Parse and guard private stage against all writes
        shell: pwsh
        run: |
          $file = 'tools/android-restore335-private-readonly-stage.ps1'
          $t = $null
          $e = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$t, [ref]$e)
          if ($e.Count -gt 0) { throw 'PRIVATE_STAGE_PARSE_FAILED' }
          $src = Get-Content -Raw $file
          foreach ($token in @('PASS_PRESENT_DIRECTORY','PRIVATE_FILES_NONEMPTY_NO_ACTION','ABSENT_IN_EMPTY_LISTING','NOT_AUTHORIZED','PASS_PINNED')) {
            if (-not $src.Contains($token)) { throw "MISSING_PRIVATE_STAGE_GUARD_$token" }
          }
          foreach ($required in @("Call-Adb @('version')","Call-Adb @('devices','-l')","'exec-out','run-as'","'stat','-c','%F','files'","'ls','-A','files'")) {
            if (-not $src.Contains($required)) { throw "MISSING_PRIVATE_READONLY_QUERY_$required" }
          }
          foreach ($bad in @('adb install','adb push','adb pull','pm clear','am force-stop','toybox dd','toybox rm','run-as $privatePackage sh')) {
            if ($src.Contains($bad)) { throw "PRIVATE_STAGE_DISALLOWED_$bad" }
          }
          Write-Host 'RESTORE335_PRIVATE_READONLY_STATIC_PASS'
      - name: Verify v2 private stage syntax and three independent package observations
        shell: pwsh
        run: |
          $path = 'tools/android-restore335-private-readonly-stage-v2.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'V2_POWERSHELL_PARSE_FAILED' }
          $s = Get-Content -LiteralPath $path -Raw
          foreach ($required in @('ANDROID_RESTORE335_PRIVATE_READONLY_V2','packagePathFirst','packageList','packagePathSecond','PRESENT_USER0','PACKAGE_IDENTITY_INCONSISTENT_OR_ABSENT_NO_PRIVATE_ACCESS','PRIVATE_FILES_NONEMPTY_NO_ACTION','NOT_AUTHORIZED')) {
            if (-not $s.Contains($required)) { throw "V2_SAFETY_GUARD_MISSING_$required" }
          }
          if (@([regex]::Matches($s, "'pm','path'")).Count -ne 3) { throw 'V2_REQUIRES_THREE_PATH_CALLS' }
          if (@([regex]::Matches($s, "'pm','list','packages'")).Count -ne 1) { throw 'V2_REQUIRES_ONE_PACKAGE_LIST' }
          Write-Host 'ANDROID_RESTORE335_V2_STATIC_PASS'
      - name: Windows mock regression — absent vs denied packages
        shell: pwsh
        run: ./tests/android-usb-preflight-mock.ps1
