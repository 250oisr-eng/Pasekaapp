name: Test managed video copy alias inventory

on:
  push:
    paths:
      - 'js/video-archive-v2-copy-inventory.js'
      - 'tests/video-archive-v2-copy-inventory.test.mjs'
      - '.github/workflows/test-video-copy-hash-alias.yml'
  pull_request:
    paths:
      - 'js/video-archive-v2-copy-inventory.js'
      - 'tests/video-archive-v2-copy-inventory.test.mjs'
      - '.github/workflows/test-video-copy-hash-alias.yml'
permissions:
  contents: read

jobs:
  read-only-alias-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Test conservative cross-ID SHA alias warnings
        run: node --test tests/video-archive-v2-copy-inventory.test.mjs
