name: "Apis mellifera Zenodo v2 bounded original ZIP range probe"
on:
  push:
    paths:
      - 'tools/probe_apis_zenodo_zip_range.py'
      - 'tests/test_probe_apis_zenodo_zip_range.py'
      - '.github/workflows/probe-apis-zenodo-zip-range.yml'
  pull_request:
    paths:
      - 'tools/probe_apis_zenodo_zip_range.py'
      - 'tests/test_probe_apis_zenodo_zip_range.py'
      - '.github/workflows/probe-apis-zenodo-zip-range.yml'
permissions:
  contents: read
jobs:
  limited-zip-range-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Range-only fail-closed original archive request tests
        run: python -m unittest discover -s tests -p 'test_probe_apis_zenodo_zip_range.py' -v
      - name: Read EXACTLY ONE original Zenodo ZIP byte, never fallback to full archive
        run: python tools/probe_apis_zenodo_zip_range.py
