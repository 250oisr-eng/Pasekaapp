name: Fast quality checks

on:
  workflow_dispatch:
  # Verify the QA verifier itself on an exact PR head without duplicating
  # the full Fast quality suite for every unrelated application PR.
  pull_request:
    paths:
      - '.github/workflows/quality.yml'
      - 'scripts/qa-tap-evidence.mjs'
      - 'tests/qa-tap-evidence.test.mjs'
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'cloudflare/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pages_source_read_only:
    name: Verify Pages source is GitHub Actions (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Read GitHub Pages source without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GH_REPOSITORY;
          if (!/^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(repository || '')) {
            throw new Error('Missing or invalid GitHub repository identifier');
          }
          const response = await fetch('https://api.github.com/repos/' + repository + '/pages', {
            headers: {
              Authorization: 'Bearer ' + process.env.GH_TOKEN,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Paseka-Pages-Source-ReadOnly-Audit'
            }
          });
          if (!response.ok) {
            throw new Error('Pages source could not be read (HTTP ' + response.status + '); source status is NOT VERIFIED.');
          }
          const configuration = await response.json();
          if (configuration.build_type !== 'workflow') {
            throw new Error('Unsafe Pages source: expected build_type=workflow; observed ' + JSON.stringify(configuration.build_type));
          }
          console.log('PASS: Pages build_type=workflow. Read-only verification; deployment NOT_ATTEMPTED.');
          NODE

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete regression suite and verify bounded TAP evidence
        shell: bash
        run: |
          # Preserve full test exit status, even if a forged/truncated TAP says PASS.
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/paseka-tests.tap"
          results=("${PIPESTATUS[@]}")
          set -e
          # Never publish TAP artifacts, user exports, secrets or device logs.
          node scripts/qa-tap-evidence.mjs "$RUNNER_TEMP/paseka-tests.tap"
          if [[ "${results[0]}" != 0 || "${results[1]}" != 0 ]]; then
            exit 1
          fi
