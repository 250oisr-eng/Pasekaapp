name: Fast quality checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  pages_source_read_only:
    name: Verify Pages source is GitHub Actions (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Read GitHub Pages source without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GH_REPOSITORY;
          if (!/^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(repository || '')) {
            throw new Error('Missing or invalid GitHub repository identifier');
          }
          const response = await fetch('https://api.github.com/repos/' + repository + '/pages', {
            headers: {
              Authorization: 'Bearer ' + process.env.GH_TOKEN,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Paseka-Pages-Source-ReadOnly-Audit'
            }
          });
          if (!response.ok) {
            throw new Error('Pages source could not be read (HTTP ' + response.status + '); source status is NOT VERIFIED.');
          }
          const configuration = await response.json();
          if (configuration.build_type !== 'workflow') {
            throw new Error('Unsafe Pages source: expected build_type=workflow; observed ' + JSON.stringify(configuration.build_type));
          }
          console.log('PASS: Pages build_type=workflow. Read-only verification; deployment NOT_ATTEMPTED.');
          NODE

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete regression suite (retain synthetic TAP evidence)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee qa-comprehensive.tap
      - name: Classify comprehensive QA evidence and unresolved physical gates
        if: always()
        run: node scripts/comprehensive-qa.mjs --tap qa-comprehensive.tap
      - name: Read-only exact-SHA health audit of watched Draft PRs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/comprehensive-pr-checks.mjs
      - name: Upload synthetic QA report only (no private files or raw test logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paseka-qa-synthetic-${{ github.sha }}
          path: |
            qa-results/comprehensive-report.json
            qa-results/draft-checks.json
          if-no-files-found: warn
          retention-days: 7
