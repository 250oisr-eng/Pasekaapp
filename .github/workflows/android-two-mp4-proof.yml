name: Build isolated two-MP4 proof APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-two-mp4-isolated-apk-proof-2026-11-21
    paths:
      - 'tests/fixtures/android-two-mp4-proof*'
      - 'tests/android-two-mp4-proof.test.mjs'
      - 'scripts/prepare-android-two-mp4-proof.mjs'
      - 'js/paseka-archive.js'
      - '.github/workflows/android-two-mp4-proof.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-web.mjs'
      - 'scripts/prepare-android-two-mp4-proof.mjs'
      - 'tests/fixtures/android-two-mp4-proof*'
      - 'scripts/patch-android-gradle.mjs'
      - 'scripts/prepare-android-archive-download.mjs'
      - '.github/workflows/android-two-mp4-proof.yml'

concurrency:
  group: two-mp4-proof-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'test/android-two-mp4-isolated-apk-proof-2026-11-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl -fsSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p android-cli
            unzip -q commandlinetools.zip -d android-cli
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -R android-cli/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses && sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Prepare web assets
        run: npm run web:prepare
      - name: Prepare isolated proof-only web and package config
        run: PASEKA_TWO_MP4_PROOF_BUILD=1 node scripts/prepare-android-two-mp4-proof.mjs web
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Inject isolated proof report bridge
        run: PASEKA_TWO_MP4_PROOF_BUILD=1 node scripts/prepare-android-two-mp4-proof.mjs native
      - name: Use Android 15-compatible Gradle toolchain
        run: node scripts/patch-android-gradle.mjs
      - name: Require Android 15 or newer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/variables.gradle';
          let source = fs.readFileSync(path, 'utf8');
          for (const [key, value] of Object.entries({ minSdkVersion: 35, compileSdkVersion: 35, targetSdkVersion: 35 })) {
            const pattern = new RegExp(`(^\\s*${key}\\s*=\\s*)\\d+`, 'm');
            if (!pattern.test(source)) throw new Error(`Could not find ${key} in ${path}`);
            source = source.replace(pattern, `$1${value}`);
          }
          fs.writeFileSync(path, source);
          const minLine = source.split(String.fromCharCode(10)).find(line => line.trim().startsWith('minSdkVersion'));
          if (Number(minLine?.split('=').pop()?.trim()) !== 35) throw new Error('Expected minSdkVersion 35');
          NODE
      - name: Build proof-only isolated debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify package ID inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ru.paseka.journal.archive.proof325'"
          if "$AAPT" dump badging "$APK" | grep -F "package: name='ru.paseka.journal'"; then
            echo "Production package ID unexpectedly found in isolated APK" >&2
            exit 1
          fi
      - name: Upload isolated archive test APK
        uses: actions/upload-artifact@v4
        with:
          name: paseka-two-mp4-proof-isolated-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
