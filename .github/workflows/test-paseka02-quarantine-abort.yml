name: Test PASEKA02 quarantine abort and retry

on:
  push:
    paths:
      - 'tests/video-archive-v2-entrance-quarantine-rollback.test.mjs'
      - 'js/video-archive-v2-entrance-quarantine-rollback.js'
      - '.github/workflows/test-paseka02-quarantine-abort.yml'
  pull_request:
    paths:
      - 'tests/video-archive-v2-entrance-quarantine-rollback.test.mjs'
      - 'js/video-archive-v2-entrance-quarantine-rollback.js'
      - '.github/workflows/test-paseka02-quarantine-abort.yml'
permissions:
  contents: read
jobs:
  isolated-rollback-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Run isolated rollback and atomic-commit regressions
        run: node --test tests/video-archive-v2-entrance-quarantine-rollback.test.mjs tests/video-archive-v2-entrance-atomic.test.mjs
