name: Research public bee query head
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tools/run_public_bee_query_head_pilot.py'
      - 'tests/test_public_bee_query_head_pilot.py'
      - 'tools/verify_public_bee_pilot_inputs.py'
      - '.github/workflows/research-public-bee-query-head.yml'
permissions:
  contents: read
jobs:
  public-query-head:
    if: github.head_ref == 'research/video-public-model-pilot-20261128' && github.event.action == 'labeled' && github.event.label.name == 'research-replay-bee-query-head'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.11.0 Pillow==12.0.0 numpy==2.2.6 scipy==1.15.3
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - name: Run experimental contract tests
        run: python -m unittest discover -s tests -p 'test_public_bee_query_head_pilot.py' -v
      - name: Run actual public-frame inference and held-out experiment
        run: python tools/run_public_bee_query_head_pilot.py
