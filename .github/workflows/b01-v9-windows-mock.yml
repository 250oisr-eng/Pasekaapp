name: B01 V9 Windows PowerShell synthetic gate
on:
  pull_request:
    paths:
      - 'tools/b01-oneplus-safe-v9/**'
      - 'tests/b01-v*-*'
      - '.github/workflows/b01-v9-windows-mock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell 5.1 against synthetic ADB only (never real phone)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path $env:RUNNER_TEMP 'paseka-b01-v9-mock'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item -Path 'tools/b01-oneplus-safe-v9/*' -Destination $sandbox -Recurse -Force
          $platform=Join-Path $sandbox 'platform-tools'
          New-Item -ItemType Directory -Force -Path $platform | Out-Null
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not (Test-Path $compiler)){throw 'Windows .NET Framework C# compiler unavailable'}
          & $compiler /nologo /target:exe "/out:$platform\adb.exe" (Join-Path (Get-Location).Path 'tests/b01-v9-MockAdb.cs')
          if($LASTEXITCODE -ne 0){throw 'Synthetic mock compiler failed'}
          [IO.File]::WriteAllText((Join-Path $platform 'AdbWinApi.dll'),'synthetic-test-marker')
          $env:B01_MOCK_STATE_DIR=$sandbox
          foreach($case in @(
            @{mode='PASS';expected='CANDIDATE_ONLY'},
            @{mode='DAEMON_STARTUP_ONCE';expected='CANDIDATE_ONLY';startup=$true},
            @{mode='BAD_HEADER';expected='BLOCKED'},
            @{mode='BAD_PRIVATE_HEADER';expected='BLOCKED'},
            @{mode='RUNNING';expected='BLOCKED'},
            @{mode='OLD_ADB';expected='BLOCKED'},
            @{mode='NO_SHELL_V2';expected='BLOCKED'},
            @{mode='REMOTE_ERROR';expected='BLOCKED'},
            @{mode='BAD_COVERAGE';expected='BLOCKED'},
            @{mode='DEVICES_STARTUP_REPEAT';expected='BLOCKED';code='ADB_DEVICES_RETRY_EXIT_OR_STDERR';probe='DEVICES_AFTER_STARTUP'},
            @{mode='DEVICES_UNKNOWN_STDERR';expected='BLOCKED';code='ADB_DEVICES_INITIAL_EXIT_OR_STDERR';probe='DEVICES_INITIAL'},
            @{mode='DEVICES_EXIT_FAIL';expected='BLOCKED';code='ADB_DEVICES_INITIAL_EXIT_OR_STDERR';probe='DEVICES_INITIAL'},
            @{mode='MODEL_FAIL';expected='BLOCKED';code='ADB_DEVICE_MODEL_EXIT_OR_STDERR';probe='DEVICE_MODEL'},
            @{mode='DEVICES_UNAUTHORIZED';expected='BLOCKED';code='EXACTLY_ONE_AUTHORIZED_DEVICE_REQUIRED'}
          )){
            $marker=Join-Path $sandbox 'b01-device-started.flag'
            if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
            $env:B01_MOCK_MODE=$case.mode
            'CAPTURE' | & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'B01-ONEPLUS-SAFE-V9.ps1') -PublicTransport EXEC_OUT -GatedPrivateCandidate -CandidateBase (Join-Path $env:RUNNER_TEMP 'paseka-b01-legacy-mock-candidates') | Out-Null
            $files=@(Get-ChildItem -Path (Join-Path $sandbox 'results') -Filter 'b01-v9-result.json' -Recurse | Sort-Object LastWriteTimeUtc)
            $latest=$files[-1]
            $report=Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
            Write-Host ("$($case.mode): $($report.status) $($report.code)")
            if($report.status -ne $case.expected){throw "Mock $($case.mode) unexpected status $($report.status)"}
            if($case.ContainsKey('code') -and $report.code -ne $case.code) {
              throw "Mock $($case.mode) unexpected code $($report.code)"
            }
            if($case.ContainsKey('probe') -and $report.adbProbeId -ne $case.probe) {
              throw "Mock $($case.mode) unexpected probe $($report.adbProbeId)"
            }
            if($case.ContainsKey('startup') -and $report.adbServerStartupObserved -ne $case.startup) {
              throw "Mock $($case.mode) startup diagnostic mismatch"
            }
            if($report.backupCompleteness -ne 'NOT_VERIFIED' -or $report.independentRestore -ne 'NOT_TESTED' -or $report.mediaStoreGalleryCoverage -ne 'NOT_TESTED'){
              throw 'False full-backup proof in synthetic runner'
            }
          }
          Remove-Item Env:B01_MOCK_MODE
          # Offline forensic tool: synthetic public TAR only, no ADB/phone.
          $validArchive = @(Get-ChildItem -Path (Join-Path $sandbox 'results') -Filter 'public-only-v9.tar' -Recurse |
            Where-Object {$_.Length -ge 1536} | Select-Object -First 1)
          if($validArchive.Count -ne 1){throw 'No synthetic public TAR fixture from mock'}
          [byte[]]$clean = [IO.File]::ReadAllBytes($validArchive[0].FullName)
          [byte[]]$badHeader = [byte[]]$clean.Clone()
          $badHeader[0] = $badHeader[0] -bxor 1
          [byte[]]$truncated = New-Object byte[] ($clean.Length-1)
          [Array]::Copy($clean,0,$truncated,0,$truncated.Length)
          [byte[]]$tail = [Text.Encoding]::ASCII.GetBytes(('tar: synthetic unavailable'.PadRight(66,'!')))
          [byte[]]$emptyTail = New-Object byte[] (1024+$tail.Length)
          [Array]::Copy($tail,0,$emptyTail,1024,$tail.Length)
          [byte[]]$appendTail = New-Object byte[] ($clean.Length+$tail.Length)
          [Array]::Copy($clean,0,$appendTail,0,$clean.Length)
          [Array]::Copy($tail,0,$appendTail,$clean.Length,$tail.Length)
          foreach($fixture in @(
            @{name='VALID';bytes=$clean;expected='HEADER_AND_EOF_STRUCTURALLY_PLAUSIBLE';status='READONLY_DIAGNOSIS_COMPLETE'},
            @{name='BAD_HEADER';bytes=$badHeader;expected='BAD_HEADER';status='READONLY_DIAGNOSIS_COMPLETE'},
            @{name='TRUNCATED';bytes=$truncated;expected='UNALIGNED_BYTES';status='READONLY_DIAGNOSIS_COMPLETE'},
            @{name='EMPTY_PLUS_TEXT';bytes=$emptyTail;expected='EMPTY_TAR_EOF_PLUS_UNALIGNED_TRAILER';status='READONLY_DIAGNOSIS_COMPLETE'},
            @{name='APPEND_DIAGNOSTIC';bytes=$appendTail;expected='UNALIGNED_BYTES';status='READONLY_DIAGNOSIS_COMPLETE'}
          )){
            $fixtureDir=Join-Path (Join-Path $sandbox 'results') ('run-offline-'+$fixture.name)
            [void][IO.Directory]::CreateDirectory($fixtureDir)
            $archiveFile=Join-Path $fixtureDir 'public-only-v9.tar'
            [IO.File]::WriteAllBytes($archiveFile,$fixture.bytes)
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'B01-PUBLIC-TAR-FORENSIC-V10.ps1') -ArchivePath $archiveFile | Out-Null
            $latest=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'forensics-results') -Filter 'public-tar-v10-*.json' |
              Sort-Object LastWriteTimeUtc -Descending)[0]
            $report=Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
            Write-Host ("OFFLINE $($fixture.name): $($report.status) $($report.structureClass) $($report.remainder512)")
            if($report.status -ne $fixture.status -or $report.structureClass -ne $fixture.expected){
              throw "Unexpected offline forensic result for $($fixture.name): $($report.status) / $($report.structureClass)"
            }
            if($report.privateAppData -ne 'NOT_READ' -or $report.adb -ne 'NOT_USED' -or $report.fullBackupVerified -ne $false){
              throw 'Offline forensic claimed device/private access or full backup'
            }
            if($fixture.name -eq 'EMPTY_PLUS_TEXT' -and ($report.archiveBytes -ne 1090 -or $report.remainder512 -ne 66 -or $report.tailPrintableAscii -ne $true -or $report.tailErrorLike -ne $true)){
              throw 'Physical V6-like synthetic tail classification failed'
            }
          }

          # V11 standalone archive discovery: prior TAR is OUTSIDE the new ZIP folder.
          $priorFolder=Join-Path $env:RUNNER_TEMP 'b01-historical-v91-extracted'
          $oldRun=Join-Path (Join-Path $priorFolder 'results') 'run-previous'
          [void][IO.Directory]::CreateDirectory($oldRun)
          $oldTar=Join-Path $oldRun 'public-only-v9.tar'
          [IO.File]::WriteAllBytes($oldTar,$emptyTail)
          $oldHash=(Get-FileHash -LiteralPath $oldTar -Algorithm SHA256).Hash
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V11.ps1') -Mode Local -SearchRoots $priorFolder -NoPicker | Out-Null
          $latest=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse)[0]
          $unified=Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
          Write-Host ("V11 HISTORICAL: $($unified.status) $($unified.priorPublicTarClass) $($unified.priorPublicTarBytes)")
          if($unified.status -ne 'PUBLIC_ONLY_DIAGNOSIS' -or $unified.priorPublicTarClass -ne 'EMPTY_TAR_EOF_PLUS_UNALIGNED_TRAILER' -or $unified.priorPublicTarBytes -ne 1090 -or $unified.adbUsed -ne 'NO'){
            throw 'V11 did not find and inspect historical TAR from another location'
          }
          if((Get-FileHash -LiteralPath $oldTar -Algorithm SHA256).Hash -ne $oldHash){
            throw 'V11 unexpectedly modified the historical TAR'
          }
          if($unified.fullBackupVerified -ne $false -or $unified.independentRestore -ne 'NOT_TESTED'){
            throw 'V11 asserted recoverable backup from only a historical TAR'
          }
          # Explicit local path and wrong-path tests, without USB.
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V11.ps1') -Mode Local -ArchivePath (Join-Path $sandbox 'README.txt') -NoPicker | Out-Null
          $bad=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse | Sort-Object LastWriteTimeUtc -Descending)[0]
          $badJson=Get-Content -LiteralPath $bad.FullName -Raw | ConvertFrom-Json
          if($badJson.status -ne 'BLOCKED' -or $badJson.code -ne 'PUBLIC_TAR_PATH_OR_LAYOUT_INVALID' -or $badJson.adbUsed -ne 'NO'){
            throw 'V11 did not block wrong existing-file selection'
          }
          $missingRoot=Join-Path $env:RUNNER_TEMP 'b01-empty-search'
          [void][IO.Directory]::CreateDirectory($missingRoot)
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V11.ps1') -Mode Local -SearchRoots $missingRoot -NoPicker | Out-Null
          $missing=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse | Sort-Object LastWriteTimeUtc -Descending)[0]
          $missingJson=Get-Content -LiteralPath $missing.FullName -Raw | ConvertFrom-Json
          if($missingJson.code -ne 'NO_PREVIOUS_PUBLIC_TAR_FOUND' -or $missingJson.adbUsed -ne 'NO'){
            throw 'V11 must stop when no public TAR exists without implicit USB fallback'
          }
          # USB path is explicit, uses mock ADB, then auto-diagnoses malformed public TAR.
          $env:B01_MOCK_MODE='BAD_HEADER'
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V11.ps1') -Mode USB -NoPicker | Out-Null
          $usb=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse | Sort-Object LastWriteTimeUtc -Descending)[0]
          $usbJson=Get-Content -LiteralPath $usb.FullName -Raw | ConvertFrom-Json
          Write-Host ("V11 USB SYNTHETIC: $($usbJson.status) $($usbJson.code) $($usbJson.priorPublicTarClass)")
          if($usbJson.status -ne 'BLOCKED_WITH_PUBLIC_DIAGNOSIS' -or $usbJson.adbUsed -ne 'YES' -or $usbJson.priorPublicTarClass -ne 'BAD_HEADER' -or $usbJson.v91PrivateTar -ne 'NOT_ATTEMPTED'){
            throw 'V11 explicit USB mock does not yield one fail-closed final report'
          }
          # V12: simulate prior V9.1 data on another fixed local drive without copying it.
          function Latest-V12 {
            $jsons=@(Get-ChildItem -LiteralPath (Join-Path $sandbox 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse |
              Sort-Object LastWriteTimeUtc -Descending)
            foreach($j in $jsons) {
              $x=Get-Content -LiteralPath $j.FullName -Raw | ConvertFrom-Json
              if($x.schema -eq 'paseka-b01-unified-gate-v12'){return $x}
            }
            throw 'No V12 unified result found'
          }
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V12.ps1') -Mode Local -SearchRoots $missingRoot -FixedSearchRoots $priorFolder -NoPicker | Out-Null
          $v12=Latest-V12
          Write-Host ("V12 FIXED FALLBACK: $($v12.status) $($v12.priorPublicTarClass) $($v12.searchTier)")
          if($v12.status -ne 'PUBLIC_ONLY_DIAGNOSIS' -or $v12.priorPublicTarBytes -ne 1090 -or $v12.searchTier -ne 'FIXED_LOCAL_DRIVES' -or $v12.adbUsed -ne 'NO'){
            throw 'V12 did not discover an old public TAR through fixed-drive fallback'
          }
          if((Get-FileHash -LiteralPath $oldTar -Algorithm SHA256).Hash -ne $oldHash){
            throw 'V12 modified old public TAR'
          }
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V12.ps1') -Mode Local -SearchRoots $missingRoot -FixedSearchRoots $missingRoot -NoPicker | Out-Null
          $v12=Latest-V12
          Write-Host ("V12 NO-SOURCE: $($v12.status) $($v12.code) $($v12.adbUsed)")
          if($v12.code -ne 'NO_PREVIOUS_PUBLIC_TAR_FOUND' -or $v12.adbUsed -ne 'NO' -or $v12.previousPublicTarFound -ne $false){
            throw 'V12 no-source/no-picker must fail closed without ADB'
          }
          $env:B01_MOCK_MODE='BAD_HEADER'
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V12.ps1') -Mode USB -NoPicker | Out-Null
          $v12=Latest-V12
          Write-Host ("V12 USB BAD HEADER: $($v12.status) $($v12.code) $($v12.v91PrivateTar)")
          if($v12.status -ne 'BLOCKED_WITH_PUBLIC_DIAGNOSIS' -or $v12.priorPublicTarClass -ne 'BAD_HEADER' -or $v12.adbUsed -ne 'YES' -or $v12.v91PrivateTar -ne 'NOT_ATTEMPTED'){
            throw 'V12 public-only USB did not reject malformed public TAR with private untouched'
          }
          $env:B01_MOCK_MODE='PASS'
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $sandbox 'RUN-ONEPLUS-UNIFIED-V12.ps1') -Mode USB -NoPicker | Out-Null
          $v12=Latest-V12
          Write-Host ("V12 USB PUBLIC PASS: $($v12.status) $($v12.v91Code) $($v12.v91PrivateTar)")
          if($v12.v91Status -ne 'PUBLIC_ONLY_PASS' -or $v12.v91Code -ne 'PUBLIC_ONLY_EXPLICIT_MODE_NO_PRIVATE_READ' -or $v12.v91PrivateTar -ne 'NOT_ATTEMPTED' -or $v12.fullBackupVerified -ne $false -or $v12.priorPublicTarClass -ne 'HEADER_AND_EOF_STRUCTURALLY_PLAUSIBLE'){
            throw 'V12 public-only USB success leaked into private-data capture or full backup claim'
          }
          Remove-Item Env:B01_MOCK_MODE

          # V13 clean-room artifact: use NO previous TAR, JSON or old test package.
          # V9 and V10 are BUNDLED code components, not external legacy dependencies.
          $fresh=Join-Path $env:RUNNER_TEMP 'b01-v13-fresh-independent'
          [void][IO.Directory]::CreateDirectory($fresh)
          foreach($name in @('RUN-ONEPLUS-UNIFIED-V13.ps1','B01-ONEPLUS-SAFE-V9.ps1','B01-PUBLIC-TAR-FORENSIC-V10.ps1')){
            Copy-Item -LiteralPath (Join-Path 'tools/b01-oneplus-safe-v9' $name) -Destination $fresh
          }
          $fakeTools=Join-Path $fresh 'platform-tools'
          [void][IO.Directory]::CreateDirectory($fakeTools)
          Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/adb.exe') -Destination $fakeTools
          Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/AdbWinApi.dll') -Destination $fakeTools
          foreach($case in @(
            @{ mode='PASS'; status='PUBLIC_ONLY_DIAGNOSIS'; code='PUBLIC_TAR_VALID_BACKUP_NOT_VERIFIED'; publicClass='HEADER_AND_EOF_STRUCTURALLY_PLAUSIBLE' },
            @{ mode='BAD_HEADER'; status='BLOCKED'; code='PUBLIC_TAR_INVALID_INVALID_TAR_HEADER_CHECKSUM'; publicClass='BAD_HEADER' },
            @{ mode='OLD_ADB'; status='BLOCKED'; code='ADB_TOO_OLD'; publicClass='NOT_TESTED' },
            @{ mode='NO_SHELL_V2'; status='BLOCKED'; code='SHELL_V2_NOT_NEGOTIATED'; publicClass='NOT_TESTED' }
          )){
            $env:B01_MOCK_MODE=$case.mode
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $fresh 'RUN-ONEPLUS-UNIFIED-V13.ps1') | Out-Null
            $candidate=@(Get-ChildItem -LiteralPath (Join-Path $fresh 'unified-results') -Filter 'b01-unified-result.json' -File -Recurse |
              Sort-Object LastWriteTimeUtc -Descending)[0]
            $json=Get-Content -LiteralPath $candidate.FullName -Raw | ConvertFrom-Json
            Write-Host ("V13 NO-LEGACY $($case.mode): $($json.status) $($json.code) $($json.publicTarClass) private=$($json.privateTar)")
            if($json.schema -ne 'paseka-b01-unified-public-only-v13' -or $json.status -ne $case.status -or
               $json.code -ne $case.code -or $json.publicTarClass -ne $case.publicClass) {
                throw "V13 unexpected outcome: $($case.mode)"
            }
            if($json.privateTar -ne 'NOT_ATTEMPTED' -or $json.fullBackupVerified -ne $false -or
               $json.independentRestore -ne 'NOT_TESTED' -or $json.previousTestRequired -ne $false -or
               $json.phoneWrites -ne 'NOT_ATTEMPTED') {
                throw "V13 safety contract failed: $($case.mode)"
            }
          }
          Remove-Item Env:B01_MOCK_MODE

          # V14 controlled transport comparison in CLEAN folders, no previous tests.
          foreach($case in @(
            @{mode='PASS';code='SHELL_PUBLIC_TAR_VALID_NO_PRIVATE_BACKUP';shell='HEADER_AND_EOF_STRUCTURALLY_PLAUSIBLE';exec='NOT_TESTED'},
            @{mode='BAD_HEADER';code='BOTH_PUBLIC_TRANSPORTS_FAILED_CLASSIFIED';shell='BAD_HEADER';exec='BAD_HEADER'},
            @{mode='SHELL_EMPTY_TAR_EXEC_VALID';code='SHELL_FAILED_EXEC_OUT_PUBLIC_TAR_VALID';shell='EMPTY_TAR_EOF_PLUS_UNALIGNED_TRAILER';exec='HEADER_AND_EOF_STRUCTURALLY_PLAUSIBLE'},
            @{mode='BOTH_PUBLIC_EMPTY_TAR';code='BOTH_PUBLIC_TRANSPORTS_FAILED_CLASSIFIED';shell='EMPTY_TAR_EOF_PLUS_UNALIGNED_TRAILER';exec='EMPTY_TAR_EOF_PLUS_UNALIGNED_TRAILER'},
            @{mode='OLD_ADB';code='ADB_TOO_OLD';shell='NOT_TESTED';exec='NOT_TESTED'}
          )){
            $fresh=Join-Path $env:RUNNER_TEMP ('b01-v14-clean-'+$case.mode)
            [void][IO.Directory]::CreateDirectory($fresh)
            foreach($name in @('RUN-ONEPLUS-UNIFIED-V14.ps1','B01-ONEPLUS-SAFE-V9.ps1','B01-PUBLIC-TAR-FORENSIC-V10.ps1')){
              Copy-Item -LiteralPath (Join-Path 'tools/b01-oneplus-safe-v9' $name) -Destination $fresh
            }
            $mock=Join-Path $fresh 'platform-tools'
            [void][IO.Directory]::CreateDirectory($mock)
            Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/adb.exe') -Destination $mock
            Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/AdbWinApi.dll') -Destination $mock
            $env:B01_MOCK_MODE=$case.mode
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $fresh 'RUN-ONEPLUS-UNIFIED-V14.ps1') | Out-Null
            $file=Join-Path $fresh 'B01-RESULT.json'
            if(-not [IO.File]::Exists($file)){throw "V14 missing one root final report ($($case.mode))"}
            $r=Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            Write-Host ("V14 $($case.mode): $($r.status) $($r.code) SHELL=$($r.shell.structure) EXEC=$($r.execOut.structure)")
            if($r.schema -ne 'paseka-b01-independent-public-transport-v14' -or
               $r.code -ne $case.code -or $r.shell.structure -ne $case.shell -or
               $r.execOut.structure -ne $case.exec) {
              throw "V14 wrong transport diagnosis for $($case.mode)"
            }
            if($r.privateTar -ne 'NOT_ATTEMPTED' -or $r.fullBackupVerified -ne $false -or
               $r.independentRestore -ne 'NOT_TESTED' -or $r.previousTestRequired -ne $false -or
               $r.phoneWrites -ne 'NOT_ATTEMPTED' -or $r.install -ne 'NOT_ATTEMPTED' -or
               $r.deleteOriginals -ne 'NOT_ATTEMPTED'){
                throw "V14 unsafe or unjustified result for $($case.mode)"
            }
            if($case.mode -eq 'SHELL_EMPTY_TAR_EXEC_VALID' -and
              ($r.shell.bytes -ne 1090 -or $r.shell.remainder512 -ne 66 -or
               $r.shell.tailErrorLike -ne $true -or $r.execOut.status -ne 'PUBLIC_ONLY_PASS')){
               throw 'V14 failed to diagnose synthetic shell-only 1090 byte diagnostic tail'
            }
            if($case.mode -eq 'BOTH_PUBLIC_EMPTY_TAR' -and
              ($r.shell.bytes -ne 1090 -or $r.execOut.bytes -ne 1090)){
               throw 'V14 failed to classify both malformed public transports'
            }
            # A re-run must not replace the existing user-facing final JSON.
            $hash=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $fresh 'RUN-ONEPLUS-UNIFIED-V14.ps1') | Out-Null
            if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $hash){
              throw 'V14 overwrote its existing final report'
            }
          }
          Remove-Item Env:B01_MOCK_MODE

          # V15 PRIVATE candidate gate: simulate on a FRESH folder and fake ADB only.
          # Actual user's prior tests may be deleted. No real device connected.
          foreach($case in @(
            @{mode='PASS';input='CAPTURE';status='PC_PRIVATE_CANDIDATE_ONLY';code='PRIVATE_CANDIDATE_EXPORTED_RESTORE_NOT_TESTED'},
            @{mode='PASS';input='';status='USER_DECLINED_PRIVATE_CAPTURE';code='USER_SKIPPED_PRIVATE_READ'},
            @{mode='BAD_PRIVATE_HEADER';input='CAPTURE';status='BLOCKED';code='PRIVATE_TAR_INVALID_INVALID_TAR_HEADER_CHECKSUM'},
            @{mode='OLD_ADB';input='CAPTURE';status='BLOCKED';code='ADB_TOO_OLD'},
            @{mode='RUNNING';input='CAPTURE';status='BLOCKED';code='APP_PROCESS_RUNNING_NO_CAPTURE'}
          )){
            $fresh=Join-Path $env:RUNNER_TEMP ('b01-v15-clean-'+$case.mode+'-'+$case.status)
            $persistent=Join-Path $env:RUNNER_TEMP ('b01-v15-persistent-'+$case.mode+'-'+$case.status)
            [void][IO.Directory]::CreateDirectory($fresh)
            foreach($name in @('RUN-ONEPLUS-UNIFIED-V15.ps1','B01-ONEPLUS-SAFE-V9.ps1')){
              Copy-Item -LiteralPath (Join-Path 'tools/b01-oneplus-safe-v9' $name) -Destination $fresh
            }
            $mock=Join-Path $fresh 'platform-tools'
            [void][IO.Directory]::CreateDirectory($mock)
            Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/adb.exe') -Destination $mock
            Copy-Item -LiteralPath (Join-Path $sandbox 'platform-tools/AdbWinApi.dll') -Destination $mock
            $env:B01_MOCK_MODE=$case.mode
            if($case.input -eq 'CAPTURE'){
              'CAPTURE' | & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $fresh 'RUN-ONEPLUS-UNIFIED-V15.ps1') -CandidateBase $persistent | Out-Null
            } else {
              '' | & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $fresh 'RUN-ONEPLUS-UNIFIED-V15.ps1') -CandidateBase $persistent | Out-Null
            }
            $jsonFile=Join-Path $fresh 'B01-RESULT.json'
            if(-not [IO.File]::Exists($jsonFile)){throw 'V15 one root JSON missing'}
            $j=Get-Content -LiteralPath $jsonFile -Raw | ConvertFrom-Json
            Write-Host ("V15 $($case.mode) $($case.status): $($j.status) $($j.code)")
            if($j.schema -ne 'paseka-b01-standalone-gated-pc-candidate-v15' -or
                $j.status -ne $case.status -or $j.code -ne $case.code) {
              throw "V15 unexpected result $($case.mode) $($case.status): $($j.status) / $($j.code)"
            }
            if($j.fullBackupVerified -ne $false -or $j.independentRestore -ne 'NOT_TESTED' -or
               $j.mediaStoreGalleryCoverage -ne 'NOT_TESTED' -or $j.phoneWrites -ne 'NOT_ATTEMPTED' -or
               $j.deleteOriginals -ne 'NOT_ATTEMPTED' -or $j.priorTestRequired -ne $false) {
              throw 'V15 falsely verified restore or changed phone'
            }
            if($case.status -eq 'PC_PRIVATE_CANDIDATE_ONLY'){
              $archives=@(Get-ChildItem -LiteralPath $persistent -Filter '*.tar' -Recurse -File)
              $manifests=@(Get-ChildItem -LiteralPath $persistent -Filter 'MANIFEST.json' -Recurse -File)
              if($archives.Count -ne 1 -or $manifests.Count -ne 1 -or
                  $j.candidateOutsideTestFolder -ne $true -or $j.candidateManifestWritten -ne $true -or
                  $j.privateTransport -ne 'EXEC_OUT') {
                throw 'V15 did not preserve off-test private candidate and manifest'
              }
              $manifest=Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
              if($manifest.sha256 -ne (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -or
                 $manifest.fullBackupVerified -ne $false) {
                throw 'V15 private candidate manifest not hash-bound or falsely verified'
              }
              # User deletes all disposable tests: preserved PC candidate must survive.
              Remove-Item -LiteralPath $fresh -Recurse -Force
              if(-not [IO.File]::Exists($archives[0].FullName)){throw 'V15 candidate was inside deleted test folder'}
            } else {
              if([IO.Directory]::Exists($persistent) -and
                 @(Get-ChildItem -LiteralPath $persistent -Filter '*.tar' -Recurse -File).Count -gt 0){
                throw 'V15 created a private archive without an authorized successful capture'
              }
            }
          }
          Remove-Item Env:B01_MOCK_MODE

      - name: Stage one independent V15 candidate backup-preflight ZIP (no data)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='tools/b01-oneplus-safe-v9'
          $dest='tools/b01-v15-bundle'
          [void][IO.Directory]::CreateDirectory($dest)
          $parts=@(
            @{from='START-UNIFIED-V15.cmd';to='START.cmd'},
            @{from='RUN-ONEPLUS-UNIFIED-V15.ps1';to='RUN-ONEPLUS-UNIFIED-V15.ps1'},
            @{from='B01-ONEPLUS-SAFE-V9.ps1';to='B01-ONEPLUS-SAFE-V9.ps1'},
            @{from='README-UNIFIED-V15.txt';to='README.txt'}
          )
          foreach($p in $parts){
            $from=Join-Path $src $p.from
            $to=Join-Path $dest $p.to
            Copy-Item -LiteralPath $from -Destination $to
            if((Get-FileHash -LiteralPath $from -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $to -Algorithm SHA256).Hash) {
              throw "V15 component mismatched: $($p.to)"
            }
          }
          if(@(Get-ChildItem -LiteralPath $dest -File).Count -ne 4){throw 'V15 bundle must have exactly 4 files'}
          if(@(Get-ChildItem -LiteralPath $dest -Recurse -File |
                Where-Object {$_.Extension -in @('.tar','.json','.db','.jpg','.mp4','.apk')}).Count -ne 0){
            throw 'V15 bundle contains data or phone artifacts'
          }

      - name: Upload ONE standalone V15 PC candidate package
        uses: actions/upload-artifact@v4
        with:
          name: PASEKA-B01-ONEPLUS-INDEPENDENT-V15
          path: tools/b01-v15-bundle/*
          if-no-files-found: error
          retention-days: 7
