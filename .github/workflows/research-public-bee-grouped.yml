name: Research grouped public bee detector
on:
  pull_request:
    paths:
      - 'tools/run_public_bee_grouped_pilot.py'
      - 'tests/test_public_bee_grouped_pilot.py'
      - '.github/workflows/research-public-bee-grouped.yml'
permissions:
  contents: read
jobs:
  grouped-cpu:
    if: github.head_ref == 'research/video-public-model-pilot-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check Pillow==12.0.0 numpy==2.2.6 scipy==1.15.3 onnx==1.18.0 onnxruntime==1.22.1
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            test -r /etc/apt/sources.list.d/ubuntu.sources
            opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -y --no-install-recommends ffmpeg
          fi
      - name: Group isolation and class mapping tests
        run: python -m unittest discover -s tests -p 'test_public_bee_grouped_pilot.py' -v
      - name: Bounded grouped training and ONNX comparison
        run: python tools/run_public_bee_grouped_pilot.py "${RUNNER_TEMP}/bee-grouped-result"
      - name: Preserve only public experimental ONNX and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bee-grouped-research
          path: |
            ${{ runner.temp }}/bee-grouped-result/report.json
            ${{ runner.temp }}/bee-grouped-result/experimental_bee_center.onnx
          retention-days: 7
          if-no-files-found: warn
