name: Audit Monash/figshare licensed bee dataset metadata (no archives)
on:
  push:
    paths:
      - 'tools/audit_licensed_native_bee_dataset_metadata.py'
      - 'tests/test_audit_licensed_native_bee_dataset_metadata.py'
      - '.github/workflows/test-licensed-native-bee-dataset-metadata.yml'
  pull_request:
    paths:
      - 'tools/audit_licensed_native_bee_dataset_metadata.py'
      - 'tests/test_audit_licensed_native_bee_dataset_metadata.py'
      - '.github/workflows/test-licensed-native-bee-dataset-metadata.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic invalid metadata rejection tests
        run: python -m unittest discover -s tests -p 'test_audit_licensed_native_bee_dataset_metadata.py' -v
      - name: Audit official publisher JSON and publish only license/source summary
        run: |
          python tools/audit_licensed_native_bee_dataset_metadata.py > /tmp/paseka-licensed-bee-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/paseka-licensed-bee-metadata.json").read_text())
          assert r["publisherDatasetLicenseMetadataVerified"] is True
          assert r["publisherDatasetLicense"] == "CC BY 4.0"
          assert r["publisherTotalArchiveSizeBytes"] == 206135340
          assert r["archiveFileCount"] == 2
          for key in ("honeyBeeApisMelliferaBenchmark",
                      "sourceZipBytesVerified", "originalVideoBytesVerified",
                      "eventDirectionGroundTruthVerified",
                      "independentInOutAccuracyMeasured",
                      "modelTrainingApprovedForPaseka",
                      "runtimeModelApprovedForPaseka",
                      "videoCleanupAuthorized"):
              assert r[key] is False, key
          print("Official CC BY 4.0 record validated; source ZIPs NOT downloaded; traffic counts remain blocked")
          PY
