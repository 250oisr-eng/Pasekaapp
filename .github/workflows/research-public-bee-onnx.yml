name: Research frozen RF-DETR ONNX portability
on:
  pull_request:
    paths:
      - 'tools/run_public_bee_onnx_pilot.py'
      - 'tests/test_public_bee_onnx_pilot.py'
      - '.github/workflows/research-public-bee-onnx.yml'
permissions:
  contents: read
  actions: read
jobs:
  onnx-cpu:
    if: github.head_ref == 'research/video-public-model-pilot-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact frozen detector delta
        uses: actions/download-artifact@v4
        with:
          name: public-bee-onnx-research
          run-id: 46130641128
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-frozen
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==5.11.0 Pillow==12.0.0 numpy==2.2.6 scipy==1.15.3 onnxruntime==1.22.1 onnx==1.18.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            test -r /etc/apt/sources.list.d/ubuntu.sources
            opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install -y --no-install-recommends ffmpeg
          fi
      - name: ONNX parity and input contract tests
        run: python -m unittest discover -s tests -p 'test_public_bee_onnx_pilot.py' -v
      - name: Export and compare real image tiles and frame detections
        run: python -u tools/run_public_bee_onnx_pilot.py "${RUNNER_TEMP}/bee-onnx" "${RUNNER_TEMP}/native-frozen/experimental_native_delta.safetensors"
      - name: Preserve validated delta, report and parity-passed ONNX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bee-onnx-research
          path: |
            ${{ runner.temp }}/bee-onnx/report.json
            ${{ runner.temp }}/bee-onnx/experimental_native_delta.safetensors
            ${{ runner.temp }}/bee-onnx/experimental_bee_fp32.onnx
          retention-days: 7
          if-no-files-found: warn
