name: Generate npm lockfile artifact

on:
  pull_request:
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'
  push:
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without installing packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate local BeeDetector link
        run: |
          node <<'NODE'
          const p = require('./package-lock.json');
          const link = p.packages?.['node_modules/@paseka/capacitor-bee-detector'];
          const target = p.packages?.['capacitor-bee-detector'];
          if (p.lockfileVersion !== 3 ||
              link?.resolved !== 'capacitor-bee-detector' ||
              link?.link !== true ||
              target?.name !== '@paseka/capacitor-bee-detector' ||
              target?.version !== '0.1.0') {
            console.error(JSON.stringify({ lockfileVersion: p.lockfileVersion, link, target }, null, 2));
            process.exit(1);
          }
          NODE
      - name: Commit reviewed lockfile to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "build: add reproducible npm lockfile"
            git push
          fi
