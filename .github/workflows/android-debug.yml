name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - 'capacitor-bee-detector/**'
      - 'scripts/prepare-web.mjs'
      - 'scripts/patch-android-gradle.mjs'
      - '.github/workflows/android-debug.yml'
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - 'capacitor-bee-detector/**'
      - 'scripts/prepare-web.mjs'
      - 'scripts/patch-android-gradle.mjs'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl -fsSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p android-cli
            unzip -q commandlinetools.zip -d android-cli
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -R android-cli/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses && sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Prepare web assets
        run: npm run web:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Use Capacitor 8 Android toolchain
        run: node scripts/patch-android-gradle.mjs
      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/variables.gradle';
          let source = fs.readFileSync(path, 'utf8');
          for (const [key, value] of Object.entries({ minSdkVersion: 24, compileSdkVersion: 36, targetSdkVersion: 36 })) {
            const pattern = new RegExp(`(^\\s*${key}\\s*=\\s*)\\d+`, 'm');
            if (!pattern.test(source)) throw new Error(`Could not find ${key} in ${path}; refusing to build with an unknown Android SDK configuration`);
            source = source.replace(pattern, `$1${value}`);
          }
          fs.writeFileSync(path, source);
          const actual = Object.fromEntries(['minSdkVersion','compileSdkVersion','targetSdkVersion'].map(key => {
            const line = source.split(/\\r?\\n/).find(item => item.trim().startsWith(key));
            return [key, Number(line?.split('=').pop()?.trim())];
          }));
          if (actual.minSdkVersion !== 24 || actual.compileSdkVersion !== 36 || actual.targetSdkVersion !== 36) {
            throw new Error('Unexpected Android SDK values: ' + JSON.stringify(actual));
          }
          console.log('Verified Android SDK configuration:', actual);
          NODE
      - name: Cache Gradle build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paseka-debug-apk-capacitor-8
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
