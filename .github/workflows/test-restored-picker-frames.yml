name: Test restored frame checks in desktop browser with simulated USB
on:
  pull_request:
    paths:
      - 'tools/check-restored-picker-frames.ps1'
      - 'tests/test_restored_picker_frames_browser.py'
      - '.github/workflows/test-restored-picker-frames.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/frame-env && /tmp/frame-env/bin/pip install playwright==1.56.0
      - run: CHROME_BIN=$(command -v google-chrome) /tmp/frame-env/bin/python -m unittest discover -s tests -p test_restored_picker_frames_browser.py -v
