name: Research public bee pilot inputs (no user data)
on:
  pull_request:
    paths:
      - 'tools/verify_public_bee_pilot_inputs.py'
      - 'tests/test_verify_public_bee_pilot_inputs.py'
      - '.github/workflows/research-public-bee-pilot.yml'
permissions:
  contents: read
jobs:
  public-pilot-inputs:
    if: github.head_ref == 'research/video-public-model-pilot-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify negative controls
        run: python -m unittest discover -s tests -p 'test_verify_public_bee_pilot_inputs.py' -v
      - name: Check CPU and free system video decoder
        run: |
          python -c "import os; print('CPU count:', os.cpu_count())"
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; }
          ffmpeg -version | head -n 1
      - name: Download exact licensed public checkpoint and original public video
        run: python tools/verify_public_bee_pilot_inputs.py
