name: Build isolated Windows 11 + Android device test kit

on:
  push:
    branches:
      - test/win11-device-automation-2026-11-19
      - test/win11-native-downloads-2026-11-19
      - test/win11-signature-safe-2026-11-19
      - fix/win11-powershell-parse-2026-11-19
      - fix/win11-report-polling-2026-11-19
      - test/pr194-win11-manual-archive-2026-11-19
      - test/pr194-native-negative-paths-2026-11-19
      - test/manual-android-offline-archive-2026-11-19
  workflow_dispatch:

concurrency:
  group: paseka-win11-device-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-windows-script:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell 5.1 before packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\Run-Paseka-Tests.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'Windows PowerShell 5.1 requires a UTF-8 BOM for Cyrillic messages.'
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Windows PowerShell 5.1 syntax validation failed.'
          }
          $source = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          if (($source -split 'function Invoke-ADB').Count -ne 2) {
            throw 'Launcher was duplicated during code generation.'
          }
          if ($source -notmatch 'device-package\.txt' -or $source -notmatch 'Get-FileHash') {
            throw 'Launcher missing the isolated APK manifest or checksum guard.'
          }
          Write-Host 'Windows PowerShell 5.1: launcher syntax, UTF-8 BOM and single-script structure OK'
      - name: Simulate native ADB missing report then retry on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows-report-polling.ps1
      - name: Verify USB and paired Wi-Fi selection on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows-adb-selection.ps1
      - name: Verify local scheduled runner is opt-in and rejects unapproved kits
        shell: powershell
        run: .\tests\windows-local-schedule.ps1
  build:
    needs: validate-windows-script
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # A new package for each Actions run/attempt avoids a signature mismatch
      # when GitHub generates a fresh Android debug signing key.
      PASEKA_TEST_PACKAGE: ru.paseka.journal.device.r${{ github.run_id }}a${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit || true)"
          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl -fsSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p android-cli
            unzip -q commandlinetools.zip -d android-cli
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -R android-cli/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses && sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression suite including device-build safety tests
        run: npm test
      - name: Enforce isolated package
        run: |
          node scripts/prepare-device-selftest.mjs config
          node -e "const c=require('./capacitor.config.json');if(c.appId!==process.env.PASEKA_TEST_PACKAGE)throw new Error('Unsafe test APK package ID')"
      - name: Prepare device-test web assets
        run: |
          npm run web:prepare
          node scripts/prepare-device-selftest.mjs web
          grep -Fq '<script src="./js/device-selftest.js"></script>' www/index.html
          test -s www/js/device-selftest.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Install native archive Downloads bridge
        run: node scripts/prepare-android-archive-download.mjs
      - name: Patch Android Gradle toolchain
        run: node scripts/patch-android-gradle.mjs
      - name: Enforce Android 15 or newer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/variables.gradle';
          let source = fs.readFileSync(path, 'utf8');
          for (const [key, value] of Object.entries({ minSdkVersion: 35, compileSdkVersion: 35, targetSdkVersion: 35 })) {
            const pattern = new RegExp('^(\\s*' + key + '\\s*=\\s*)\\d+', 'm');
            if (!pattern.test(source)) throw new Error('Missing ' + key);
            source = source.replace(pattern, (_match, prefix) => prefix + value);
            if (!(new RegExp('^\\s*' + key + '\\s*=\\s*' + value + '\\s*$', 'm')).test(source)) {
              throw new Error('Could not require ' + key + '=' + value);
            }
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Inject isolated test report bridge
        run: |
          node scripts/prepare-device-selftest.mjs android
          JAVA_DIR="android/app/src/main/java/$(printf '%s' "$PASEKA_TEST_PACKAGE" | tr '.' '/')"
          grep -Fq 'PasekaDeviceTestBridge' "$JAVA_DIR/MainActivity.java"
          grep -Fq 'PasekaArchiveDownloadBridge' "$JAVA_DIR/MainActivity.java"
          test -s "$JAVA_DIR/PasekaDeviceTestBridge.java"
          grep -Fq 'verifyAndRemoveTestDownload' "$JAVA_DIR/PasekaDeviceTestBridge.java"
      - name: Build isolated debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='$PASEKA_TEST_PACKAGE'"
          if "$AAPT" dump badging "$APK" | grep -F "package: name='ru.paseka.journal'"; then
            echo "Production ID detected in isolated APK" >&2
            exit 1
          fi
      - name: Assemble self-contained Windows 11 kit with official ADB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p device-kit
          cp android/app/build/outputs/apk/debug/app-debug.apk device-kit/paseka-device-test.apk
          sha256sum device-kit/paseka-device-test.apk | awk '{print $1}' > device-kit/paseka-device-test.sha256
          printf '%s\n' "$PASEKA_TEST_PACKAGE" > device-kit/device-package.txt
          cp scripts/windows/Run-Paseka-Tests.ps1 scripts/windows/Run-Local-Scheduled.ps1 scripts/windows/Register-Local-Scheduled.ps1 scripts/windows/START-TESTS.cmd scripts/windows/START-OFFLINE-TESTS.cmd scripts/windows/README-WIN11.txt device-kit/
          curl --retry 3 --fail --location --silent --show-error \
            https://dl.google.com/android/repository/platform-tools-latest-windows.zip -o "$RUNNER_TEMP/platform-tools-windows.zip"
          unzip -q "$RUNNER_TEMP/platform-tools-windows.zip" -d device-kit/
          test -s device-kit/platform-tools/adb.exe
          test -s device-kit/platform-tools/AdbWinApi.dll
          test -s device-kit/device-package.txt
          test -s device-kit/START-TESTS.cmd
      - name: Upload portable Windows and Android physical test kit
        uses: actions/upload-artifact@v4
        with:
          name: paseka-win11-android-selftest-kit
          path: device-kit/
          if-no-files-found: error
          retention-days: 14
