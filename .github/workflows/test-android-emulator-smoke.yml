name: Test Paseka Android emulator launch (synthetic CI only)

on:
  push:
    paths:
      - '.github/workflows/test-android-emulator-smoke.yml'
      - 'tests/video-synthetic-cleanup-atomicity.test.mjs'
      - 'capacitor.config.json'
      - 'scripts/prepare-web.mjs'
  pull_request:
    paths:
      - '.github/workflows/test-android-emulator-smoke.yml'
      - 'tests/video-synthetic-cleanup-atomicity.test.mjs'
      - 'capacitor.config.json'
      - 'scripts/prepare-web.mjs'

permissions:
  contents: read

jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate isolated debug build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run web:prepare
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Emulator install/launch smoke, without user data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '1'
            adb install --no-streaming android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path ru.paseka.journal | grep -q 'package:'
            adb shell am start -W -n ru.paseka.journal/.MainActivity
            sleep 5
            adb shell pidof ru.paseka.journal | grep -E '^[0-9]+'
            echo "EMULATOR_INSTALL_LAUNCH_PASS (not physical video, recognition, archive or deletion proof)"
