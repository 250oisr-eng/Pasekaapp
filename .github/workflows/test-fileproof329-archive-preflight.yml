name: Fileproof329 archive preflight (read-only)
on:
  pull_request:
    paths:
      - 'tools/fileproof329-archive-preflight.mjs'
      - 'tools/android-fileproof329-readonly-preflight.ps1'
      - 'tests/fileproof329-archive-preflight.test.mjs'
      - 'js/paseka-archive.js'
      - '.github/workflows/test-fileproof329-archive-preflight.yml'
  push:
    branches:
      - 'test/android-fileproof329-restore-preflight-2026-11-21'
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse script
        run: node --check tools/fileproof329-archive-preflight.mjs
      - name: Parse read-only Windows device script
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tools/android-fileproof329-readonly-preflight.ps1',[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ $errors | ForEach-Object {Write-Error $_}; exit 1 }
      - name: Negative and source-safety checks
        run: node --test tests/fileproof329-archive-preflight.test.mjs
      - name: Simulate ADB devices failure with real PowerShell process invocation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/adb" <<'MOCK'
          #!/usr/bin/env bash
          if [[ "$1" == "devices" && "$2" == "-l" ]]; then
            echo "mock disconnected test device" >&2
            exit 1
          fi
          exit 97
          MOCK
          chmod +x "$RUNNER_TEMP/mockbin/adb"
          export PATH="$RUNNER_TEMP/mockbin:$PATH"
          set +e
          pwsh -NoProfile -File tools/android-fileproof329-readonly-preflight.ps1 > "$RUNNER_TEMP/result.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/result.txt"
          test "$status" -eq 2
          grep -q 'ADB_DIAGNOSTIC: DEVICES EXIT_1' "$RUNNER_TEMP/result.txt"
          grep -q 'DETAIL: ADB_EXIT_1_DEVICES' "$RUNNER_TEMP/result.txt"
          grep -q 'mock disconnected test device' "$RUNNER_TEMP/result.txt"
          grep -q 'NO_INSTALL_NO_RESET_NO_STOP_NO_RESTORE_NO_DELETE' "$RUNNER_TEMP/result.txt"
